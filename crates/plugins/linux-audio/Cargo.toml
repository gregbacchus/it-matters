[package]
name = "it-matters-plugin-linux-audio"
description = "it-matters plugin: the default speaker's volume and mute, and whether a microphone is in use (PipeWire)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
it-matters-model = { workspace = true }
it-matters-plugin-sdk = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "process", "io-util"] }

[dev-dependencies]
it-matters-core = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "process", "io-util", "net"] }
