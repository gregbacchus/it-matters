[package]
name = "it-matters"
description = "A lightweight Matter bridge daemon that hosts plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
it-matters-model = { workspace = true }
it-matters-core = { workspace = true }
it-matters-matter = { workspace = true }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
tokio = { workspace = true, features = ["rt", "net", "time", "signal", "sync", "macros"] }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
