[package]
name = "it-matters-core"
description = "Plugin host core for it-matters: device mapping, endpoint ids, registry and lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
it-matters-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-channel = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "test-util", "io-util", "time", "net", "sync"] }
