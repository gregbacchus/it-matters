# Complete example for it-matters. Every option is optional; see docs/config/README.md.

watch: true                       # reload this file when it changes (where the option allows)

bridge:                           # how the bridge presents itself to controllers
  name: Home Bridge
  vendor_id: 0xFFF1               # Matter test vendor id
  product_id: 0x8000

matter:
  storage_dir: /var/lib/it-matters   # fabrics, commissioning data, endpoint ids
  passcode: null                  # null = the stack's default; or an 8-digit setup passcode
  discriminator: null             # null = the stack's default; or 0-4095

ipc:
  socket: /run/it-matters/plugins.sock   # where local plugins connect

plugins:
  # A local plugin the daemon starts and supervises (restarting it if it exits). It finds the socket and
  # its id in $IT_MATTERS_SOCKET and $IT_MATTERS_PLUGIN_ID. If the command does not exist the daemon logs
  # `cannot start` and keeps retrying, so point it at a real plugin.
  - id: linux-system
    run:
      command: /usr/local/bin/it-matters-plugin-linux-system   # bundled: online / signed-in sensors
      args: [--device, office-pc, --name, Office PC]
      timeout_ms: 2000        # how long the plugin has to answer a controller's write
  # The bundled audio plugin (speaker volume/mute, microphone in use) is configured the same way:
  #   command: /usr/local/bin/it-matters-plugin-linux-audio, args: [--device, office-pc-audio]
  # A remote agent (e.g. a desktop) that connects over TCP. Non-loopback needs a token file.
  # NOT IMPLEMENTED YET: validated, but nothing listens (the daemon logs a warning at start).
  - id: desktop-agent
    connect:
      listen: 0.0.0.0:7550
      token_file: /etc/it-matters/agent.token

devices:                          # optional overrides, by device id
  desktop-audio:
    name: Office PC Audio
